<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>GymEats</title>

<meta name="description" content="Desafios de comida entre amigos. Poste seu prato todo dia.">
<!-- A barra de status do celular segue o tema; sem os dois o Android
     pinta a barra de claro mesmo com o app no escuro. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
<link rel="manifest" href="./manifest.webmanifest">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "default" de propósito: o iOS usa o theme-color acima pra pintar a barra.
     "black-translucent" fixaria texto branco, ilegível no tema claro. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GymEats">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="icon" href="./assets/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="./src/css/app.css">
</head>
<body>
  <div id="app" class="app">
    <div class="boot">
      <div class="boot-mark"></div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
